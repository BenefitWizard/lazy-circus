name: lazy-circus-testing
version: 0.1.0.0
language: GHC2021
github: "BenefitWizard/lazy-circus"
license: MIT
author: "Aleksandr Tortsev"
maintainer: "acialo@yandex.ru"
copyright: "2026 Author name here"

extra-source-files:
  - README.md

synopsis: Internal testing toolkit for Lazy Circus
description: Mocks, test performers and scenario helpers for testing Lazy Circus
  programs. Please see testing/README.md.

dependencies:
  - base >= 4.7 && < 5
  - rio
  - text
  - stm
  - transformers
  - hspec
  - lazy-circus
  - aeson
  - resource-pool
  - postgresql-simple
  - mime-mail
  - openai
  - servant-client
  - telegram-bot-api
  - telegram-bot-simple
  - telegram-bot-extra

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  default-extensions:
    - MultiWayIf
    - OverloadedStrings
    - NoImplicitPrelude
    - GADTs
    - FlexibleContexts
    - FlexibleInstances
    - TypeFamilies
    - TypeApplications
    - StrictData

tests:
  test:
    main: Spec.hs
    source-dirs: test
    verbatim:
      build-tool-depends: hspec-discover:hspec-discover == 2.*
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - lazy-circus-testing
      - hspec
      # Deps used by Bdd/RunnerSpec.hs (mirrors of library-level deps).
      - directory
      - servant-auth-server
      - jose
      - http-client-tls
