services:
  db:
    image: "postgres"
    container_name: "lazy_postgres"
    environment:
      POSTGRES_PASSWORD: "my_password"
    ports:
      - "5432:5432"
  mailpit:
    image: "axllent/mailpit"
    container_name: "lazy_mailpit"
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
